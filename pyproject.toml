[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-pr"
version = "0.1.0"
description = "Mutation testing CLI that finds gaps in your test suite"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["pytest>=7.0"]

[project.scripts]
ghost = "ghost_pr.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ghost_pr*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"ghost_pr.demo_fixtures" = ["*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

